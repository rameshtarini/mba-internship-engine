name: Scheduled run

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install httpx pyyaml python-dateutil pytz

      - name: Run engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python run.py

      - name: Commit changes
        run: |
          git config user.name "mba-internship-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ data/postings.csv README.md
          git diff --cached --quiet && echo "No changes to commit." || \
            git commit -m "chore: engine run $(date -u '+%Y-%m-%d %H:%M UTC')" && git push
